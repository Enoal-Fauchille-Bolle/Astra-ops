namespace: web

image:
  repository: ghcr.io/enoal-fauchille-bolle/advent-calendar
  tag: 0.4.0
  pullPolicy: IfNotPresent

replicaCount: 1

# Logins are signed cookies and the content is read-only; the only state is the push
# folder, which two pods share during a rollout (one node) and use without conflict
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

service:
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  hosts:
    - avent.enoal.fr

env:
  # Contact for the push services, sent with each notification
  - name: ADVENT_VAPID_SUBJECT
    value: https://avent.enoal.fr

envFrom:
  - secretRef:
      name: advent-calendar-secrets

# Created by hand and filled from the laptop: see README.md
volumes:
  content:
    hostPath: /opt/k3s-data/advent-calendar
    hostPathType: Directory
    mountPath: /content
    readOnly: true
  # Push subscriptions and the days already sent; written by the pod (uid 1000)
  state:
    hostPath: /opt/k3s-data/advent-calendar-state
    hostPathType: Directory
    mountPath: /state

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 5

resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

externalSecrets:
  - name: advent-calendar-es
    targetName: advent-calendar-secrets
    data:
      - secretKey: ADVENT_PASSWORD_HASH
        remoteRef:
          key: ADVENT_PASSWORD_HASH
      - secretKey: ADVENT_AUTHOR_PASSWORD_HASH
        remoteRef:
          key: ADVENT_AUTHOR_PASSWORD_HASH
      - secretKey: ADVENT_SESSION_SECRET
        remoteRef:
          key: ADVENT_SESSION_SECRET
      - secretKey: ADVENT_VAPID_PRIVATE_KEY
        remoteRef:
          key: ADVENT_VAPID_PRIVATE_KEY
