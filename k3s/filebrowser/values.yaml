namespace: media

image:
  repository: filebrowser/filebrowser
  tag: v2.63.23
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: Recreate

service:
  port: 80
  targetPort: 80

ingress:
  enabled: true
  hosts:
    - drive.enoal.fr
    - filebrowser.lan

volumes:
  files:
    hostPath: /mnt/data/k3s-pvc/filebrowser
    mountPath: /srv
  media:
    hostPath: /mnt/data/media
    mountPath: /srv/Media
  # The phone backups only: the rest of /mnt/data/backups holds the database dumps and the
  # Proxmox configuration copy, secrets this root container could read and serve
  backups:
    hostPath: /mnt/data/backups/OnePlus-10T
    mountPath: /srv/Backups/OnePlus-10T
  db:
    hostPath: /opt/k3s-data/filebrowser
    mountPath: /database

securityContext:
  runAsUser: 0

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 512Mi
