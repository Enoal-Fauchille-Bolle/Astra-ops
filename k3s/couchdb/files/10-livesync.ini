; Settings required by Obsidian Self-hosted LiveSync, taken from the official
; docker/config/livesync.ini and docker/scripts/couchdb-init.sh of
; https://github.com/vrtmrz/obsidian-livesync
;
; The copy-config initContainer copies this file into local.d/ on every start:
; the image chowns everything under /opt/couchdb, which fails on a read-only
; ConfigMap mount. The "10-" prefix sorts it before the image's docker.ini, so
; runtime changes made through the API land in docker.ini, not here. docker.ini
; persists on the host and is read last: its values override this file.

[couchdb]
; Creates _users and _replicator on startup, replacing the _cluster_setup call
; of the official init script
single_node = true
max_document_size = 50000000

[chttpd]
require_valid_user = true
enable_cors = true
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
; Origins used by the Obsidian desktop and mobile apps
credentials = true
origins = app://obsidian.md,capacitor://localhost,http://localhost

[log]
level = warning
