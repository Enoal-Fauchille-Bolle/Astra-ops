apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.strategy }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        # CouchDB only reads its ini files at startup: restart it when they change
        checksum/config: {{ .Files.Get "files/10-livesync.ini" | sha256sum }}
    spec:
      initContainers:
        # ConfigMap mounts are read-only and the image chowns /opt/couchdb at
        # startup, so the ini file is copied into the writable local.d/ instead
        - name: copy-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["cp", "/livesync/10-livesync.ini", "{{ .Values.volumes.config.mountPath }}/10-livesync.ini"]
          volumeMounts:
            - mountPath: /livesync
              name: livesync-config
              readOnly: true
            - mountPath: {{ .Values.volumes.config.mountPath }}
              name: config-vol
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          volumeMounts:
            {{- range $name, $vol := .Values.volumes }}
            - mountPath: {{ $vol.mountPath }}
              name: {{ $name }}-vol
            {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: livesync-config
          configMap:
            name: {{ .Chart.Name }}-config
        {{- range $name, $vol := .Values.volumes }}
        - name: {{ $name }}-vol
          hostPath:
            path: {{ $vol.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
