namespace: monitoring

image:
  repository: louislam/uptime-kuma
  tag: 2.5.5
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: Recreate

service:
  port: 80
  targetPort: 3001

ingress:
  enabled: true
  hosts:
    - uptime.enoal.fr
    - status.enoal.fr
  # Public probe: UptimeRobot reads one badge, the backup scripts on Astra and
  # Pulsar push their result. Traefik answers 404 on every other path.
  probe:
    host: kuma-probe.enoal.fr
    paths:
      - path: /api/badge/41/status # monitor 41 = Pulsar
        pathType: Exact
      - path: /api/push/
        pathType: Prefix

dns:
  policy: None
  nameservers:
    - 192.168.1.202
    - 10.43.0.10
  searches:
    - svc.cluster.local
    - cluster.local
    - lan

volumes:
  data:
    hostPath: /opt/k3s-data/uptimekuma
    mountPath: /app/data

resources:
  requests:
    cpu: 10m
    memory: 640Mi
  limits:
    cpu: 100m
    memory: 1Gi
