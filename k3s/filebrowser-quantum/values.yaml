namespace: media

image:
  repository: gtstef/filebrowser
  tag: 1.5.6-stable
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: Recreate

service:
  port: 80
  targetPort: 80

ingress:
  enabled: true
  hosts:
    - drive.enoal.fr
    - filebrowser-quantum.lan

volumes:
  # `drive` is Pulsar's dedicated personal disk (scsi2, 64G on the WD Blue, /mnt/drive).
  # It is the only place this container may serve: everything else on Pulsar is system data
  drive:
    hostPath: /mnt/drive
    mountPath: /srv/drive
  # Films stay on the Netac (replaceable, no backup) and are shown read-only, so neither
  # this app nor SFTPGo can delete them
  films:
    hostPath: /mnt/data/media/movies
    mountPath: /srv/Films
    readOnly: true
  db:
    hostPath: /opt/k3s-data/filebrowser-quantum
    mountPath: /home/filebrowser/data/

# 1000 is the image's own `filebrowser` user, and `enoal` on pulsar. hostPath volumes ignore
# fsGroup, so /mnt/drive and its tree were created as 1000:1000, and SFTPGo's user carries
# uid/gid 1000 so that its uploads stay readable here
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 96Mi
  limits:
    cpu: 200m
    # 512Mi got it OOM-killed on 2026-09-15 while previewing ~30 PDFs at once (521Mi peak);
    # numImageProcessors is lowered to 2 in the config.yaml on pulsar, outside this repo
    memory: 768Mi
