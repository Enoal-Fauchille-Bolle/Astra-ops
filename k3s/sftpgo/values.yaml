namespace: media

image:
  repository: ghcr.io/drakkan/sftpgo
  tag: v2.7.6
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: Recreate

service:
  web:
    port: 8080
    targetPort: 8080
  sftp:
    port: 2022
    targetPort: 2022
    nodePort: 30022

ingress:
  enabled: true
  hosts:
    - sftpgo.lan

volumes:
  # `drive` is Pulsar's dedicated personal disk (scsi2, 64G on the WD Blue, /mnt/drive).
  # It replaces the media, backups and filebrowser mounts: /mnt/data/backups also held the
  # database dumps and the Proxmox configuration copy, which this container must never serve
  drive:
    hostPath: /mnt/drive
    mountPath: /data/drive
  # Films stay on the Netac (replaceable, no backup) and are shown read-only
  films:
    hostPath: /mnt/data/media/movies
    mountPath: /data/Films
    readOnly: true
  data:
    hostPath: /opt/k3s-data/sftpgo
    mountPath: /var/lib/sftpgo

# 1000 is the image's own `sftpgo` user, and owns every user folder mounted above since
# Filebrowser Quantum went non-root. hostPath volumes ignore fsGroup, so
# /opt/k3s-data/sftpgo was chowned to 1000 by hand. Since `drive`, the database dumps and
# the Proxmox configuration copy are no longer mounted at all
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

env:
  - name: SFTPGO_SMTP__HOST
    valueFrom:
      secretKeyRef:
        name: sftpgo-secrets
        key: host
  - name: SFTPGO_SMTP__PORT
    valueFrom:
      secretKeyRef:
        name: sftpgo-secrets
        key: port
  - name: SFTPGO_SMTP__FROM
    valueFrom:
      secretKeyRef:
        name: sftpgo-secrets
        key: from
  - name: SFTPGO_SMTP__USER
    valueFrom:
      secretKeyRef:
        name: sftpgo-secrets
        key: username
  - name: SFTPGO_SMTP__PASSWORD
    valueFrom:
      secretKeyRef:
        name: sftpgo-secrets
        key: password
  - name: SFTPGO_SMTP__ENCRYPTION
    valueFrom:
      secretKeyRef:
        name: sftpgo-secrets
        key: encryption

resources:
  requests:
    cpu: 10m
    memory: 80Mi
  limits:
    cpu: 200m
    memory: 192Mi

externalSecrets:
  - name: sftpgo-es
    targetName: sftpgo-secrets
    data:
      - secretKey: host
        remoteRef:
          key: SMTP_HOST
      - secretKey: port
        remoteRef:
          key: SMTP_PORT
      - secretKey: from
        remoteRef:
          key: SFTPGO_SMTP_FROM
      - secretKey: encryption
        remoteRef:
          key: SFTPGO_SMTP_ENCRYPTION
      - secretKey: username
        remoteRef:
          key: SMTP_USERNAME
      - secretKey: password
        remoteRef:
          key: SFTPGO_SMTP_PASSWORD
