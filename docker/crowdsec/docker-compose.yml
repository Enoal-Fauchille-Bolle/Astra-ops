services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    container_name: crowdsec
    restart: unless-stopped
    environment:
      GID: "1000"
      COLLECTIONS: "crowdsecurity/nginx-proxy-manager"
      USE_WAL: "true"
    volumes:
      # Crowdsec persistence
      - /opt/docker-data/crowdsec/config:/etc/crowdsec
      - /opt/docker-data/crowdsec/data:/var/lib/crowdsec/data
      # Mount NPM data directory to Crowdsec
      - /opt/docker-data/npm/data/logs:/var/log/npm:ro
      # Crafty Server Watcher's log file, for the Minecraft scan scenario
      - /opt/docker-data/crafty/watcher/logs:/var/log/crafty-watcher:ro
    ports:
      - "8080:8080"
    security_opt:
      - no-new-privileges:true

  web-ui:
    # Dashboard to browse alerts and add or remove bans, served as crowdsec.lan
    image: ghcr.io/theduffman85/crowdsec-web-ui:2026.10.2
    container_name: crowdsec_web_ui
    restart: unless-stopped
    environment:
      CONFIG_INSTANCE_LAPI_URL: http://crowdsec:8080
      CONFIG_INSTANCE_LAPI_AUTH_USERNAME: crowdsec-web-ui
      CONFIG_INSTANCE_LAPI_AUTH_PASSWORD: ${CROWDSEC_WEB_UI_PASSWORD}
      CONFIG_INSTANCE_METRICS_URL: http://crowdsec:6060/metrics
      # Show the (simul)ban decisions of scenarios still in simulation
      CONFIG_CROWDSEC_SIMULATIONS_ENABLED: "true"
    volumes:
      - /opt/docker-data/crowdsec/web-ui:/app/data
    ports:
      - "3000:3000"
    depends_on:
      - crowdsec

  cloudflare-sync:
    # Copies CrowdSec's own bans into the WAF custom rule "CrowdSec bans" on enoal.fr:
    # the firewall bans never see traffic proxied by Cloudflare
    image: python:3.14.8-alpine3.24
    container_name: crowdsec_cloudflare_sync
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    # Python as PID 1 ignores SIGTERM: without an init, every stop waits 10 s for a kill
    init: true
    command: ["python", "-u", "/app/cloudflare_sync.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      # Log in Paris time, like the Web UI; Pulsar's own clock stays UTC
      TZ: "Europe/Paris"
      CROWDSEC_LAPI_URL: http://crowdsec:8080
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_CLOUDFLARE_SYNC_KEY}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_SYNC_TOKEN}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID}
      CLOUDFLARE_RULE_NAME: CrowdSec bans
      KUMA_PUSH_URL: ${CLOUDFLARE_SYNC_KUMA_PUSH_URL}
    volumes:
      # Copy of cloudflare-sync/cloudflare_sync.py in this repository
      - /opt/docker-data/crowdsec/cloudflare-sync:/app:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      - crowdsec
