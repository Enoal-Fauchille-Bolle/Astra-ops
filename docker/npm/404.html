    /* Colours and sizes taken from the portfolio at enoal.fr */
    :root {
      --navy: #0a192f;
      --lightest-navy: #233554;
      --slate: #8892b0;
      --lightest-slate: #ccd6f6;
      --accent: #2bb5e8;
      --font-sans: "Inter", -apple-system, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --easing: cubic-bezier(0.645, 0.045, 0.355, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      background: var(--navy);
      color: var(--slate);
      font: 20px/1.3 var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
      background: var(--lightest-navy);
      color: var(--lightest-slate);
    }

    main {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 50px clamp(25px, 8vw, 150px);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--accent);
      font: 600 clamp(100px, 25vw, 200px)/1 var(--font-mono);
    }

    h2 {
      margin: 0 0 10px;
      color: var(--lightest-slate);
      font-size: clamp(30px, 5vw, 50px);
      font-weight: 400;
      line-height: 1.1;
    }

    p {
      margin: 10px 0 0;
      max-width: 540px;
      overflow-wrap: anywhere;
    }

    /* The requested address, filled in by the script below */
    .host {
      color: var(--lightest-slate);
      font-family: var(--font-mono);
      font-size: 0.9em;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    /* The portfolio's big button: outlined, lifted with a hard shadow on hover */
    .button {
      display: inline-block;
      padding: 1.25rem 1.75rem;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: transparent;
      color: var(--accent);
      font: 14px/1 var(--font-mono);
      text-decoration: none;
      cursor: pointer;
    }

    .button.secondary {
      border-color: var(--slate);
      color: var(--slate);
    }

    .button:hover,
    .button:focus-visible {
      outline: none;
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 4px 4px 0 0 var(--accent);
      transform: translate(-5px, -5px);
    }

    @media (prefers-reduced-motion: no-preference) {
      .button {
        transition: all 0.25s var(--easing);
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>There’s nothing at <span id="host">this address</span>.</p>

    <div class="actions">
      <button type="button" class="button secondary" id="back" hidden>Go back</button>
      <a class="button" href="https://enoal.fr/">Go to enoal.fr</a>
    </div>
  </main>

  <script>
    if (location.hostname) {
      const host = document.getElementById("host");
      host.textContent = location.hostname;
      host.className = "host";
    }

    // A tab opened straight on this address has no previous page to go back to
    if (history.length > 1) {
      const back = document.getElementById("back");
      back.hidden = false;
      back.addEventListener("click", () => history.back());
    }
  </script>
</body>

</html>
