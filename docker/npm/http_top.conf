# Authenticated Origin Pulls (AOP). Cloudflare presents a client certificate, signed by
# aop-ca.pem, on every connection it opens to NPM. An HTTPS request for a protected name
# that comes without it is refused, unless the connection itself comes from the LAN or
# the VPN. Every HTTPS host asks for the certificate; only the names below enforce it.
ssl_verify_client optional;
ssl_client_certificate /data/nginx/custom/aop-ca.pem;

# Address of the connection itself, before CF-Connecting-IP is read.
geo $realip_remote_addr $aop_trusted {
    default 0;
    192.168.1.0/24 1;  # LAN
    192.168.27.0/24 1; # VPN
}

# Every name of the zone is protected, except those whose DNS record points at the box
# directly (DNS only): Cloudflare never sees their traffic.
map $host $aop_protected {
    default 0;
    enoal.fr 1;
    ~\.enoal\.fr$ 1;
    immich.enoal.fr 0;
    registry.enoal.fr 0;
    rootssmp.enoal.fr 0;
}

map "$https:$aop_protected:$aop_trusted:$ssl_client_verify" $aop_deny {
    default 0;
    "on:1:0:SUCCESS" 0;
    "~^on:1:0:" 1;
}

