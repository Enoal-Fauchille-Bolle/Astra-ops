services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: portracker-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  portracker:
    image: mostafawahied/portracker:1.3.13
    container_name: portracker
    restart: unless-stopped
    # Reads the host's listening ports from /proc/1/net. No SYS_PTRACE, SYS_ADMIN or
    # apparmor:unconfined (2026-09-15): together with the host PID namespace they let the
    # container take over any host process. Cost, measured: host ports (not Docker ones) show
    # no program name — `sudo ss -tulpn` on Pulsar gives it
    pid: "host"
    volumes:
      - /opt/docker-data/portracker:/data
    ports:
      - "4999:4999"
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
    depends_on:
      - docker-proxy
