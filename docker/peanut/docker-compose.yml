services:
  peanut:
    image: brandawg93/peanut:6.0.0
    container_name: peanut
    restart: unless-stopped
    volumes:
      # Must be writable by UID/GID 1000, the user the container runs as
      - /opt/docker-data/peanut/config:/config
    ports:
      - 8085:8080
    environment:
      - WEB_PORT=8080
      # Keeps the web login in the mounted volume; the default path is inside the container
      - AUTH_FILE_PATH=/config/auth.yaml
