# Restored to /etc/nut/upsmon.conf. Replace CHANGE_ME with the password of the upsmon account
# defined in upsd.users.
MONITOR eaton3s@localhost 1 upsmon CHANGE_ME master
MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"
NOTIFYCMD "/usr/local/bin/nut-discord.sh"
POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15
POWERDOWNFLAG "/etc/killpower"
NOTIFYMSG ONLINE   "🔌 [ %s ] Restored to line power"
NOTIFYMSG ONBATT   "⚠️  [ %s ] POWER OUTAGE! Running on battery"
NOTIFYMSG LOWBATT  "🚨 [ %s ] CRITICAL: Battery is low!"
NOTIFYMSG FSD      "🛑 [ %s ] FORCED SHUTDOWN sequence initiated"
NOTIFYMSG COMMOK   "🔗 [ %s ] USB communication established"
NOTIFYMSG COMMBAD  "❌ [ %s ] USB communication lost"
NOTIFYMSG REPLBATT "💀 [ %s ] HARDWARE ALERT: Battery needs replacement"
NOTIFYMSG NOCOMM   "👻 [ %s ] WARNING: UPS is unavailable or unreachable"
NOTIFYMSG SHUTDOWN "💻 [ %s ] SYSTEM HALT: Executing shutdown command"
NOTIFYMSG NOPARENT "🔥 [ %s ] FATAL ERROR: upsmon parent process died"
NOTIFYMSG CAL      "🔋 [ %s ] INFO: Battery calibration in progress"
NOTIFYFLAG ONLINE   SYSLOG+WALL+EXEC
NOTIFYFLAG ONBATT   SYSLOG+WALL+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+WALL+EXEC
NOTIFYFLAG FSD      SYSLOG+WALL+EXEC
NOTIFYFLAG COMMOK   SYSLOG+WALL+EXEC
NOTIFYFLAG COMMBAD  SYSLOG+WALL+EXEC
NOTIFYFLAG REPLBATT SYSLOG+WALL+EXEC
NOTIFYFLAG NOCOMM   SYSLOG+WALL+EXEC
NOTIFYFLAG SHUTDOWN SYSLOG+WALL+EXEC
NOTIFYFLAG NOPARENT SYSLOG+WALL+EXEC
NOTIFYFLAG CAL      SYSLOG+WALL+EXEC
OFFDURATION 30
RBWARNTIME 43200
NOCOMMWARNTIME 300
FINALDELAY 5
