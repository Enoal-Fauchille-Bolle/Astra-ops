# Drop-in for the Beszel agent, installed as
# /etc/systemd/system/beszel-agent.service.d/extra-filesystems.conf
# Reports /mnt/pve/vault (installer images) and /mnt/pbs-datastore (the PBS
# vault, which now holds every backup), so a disk alert can watch both.
[Unit]
After=mnt-pve-vault.mount mnt-pbs\x2ddatastore.mount

[Service]
Environment="EXTRA_FILESYSTEMS=/mnt/pve/vault,/mnt/pbs-datastore"
