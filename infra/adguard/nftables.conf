#!/usr/sbin/nft -f
# /etc/nftables.conf in LXC 101 (AdGuard Home). See docs/infrastructure.md#firewalls.

flush ruleset

define lan = { 192.168.1.0/24, 192.168.27.0/24 }

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		# Ping, and in IPv6 the neighbour discovery and router adverts the address needs
		ip protocol icmp accept
		meta l4proto ipv6-icmp accept

		# 53 DNS, 80 web UI, 22 SSH, 45876 Beszel agent
		ip saddr $lan udp dport 53 accept
		ip saddr $lan tcp dport { 22, 53, 80, 45876 } accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
