# Drop-in for the Beszel agent, installed as
# /etc/systemd/system/beszel-agent.service.d/hub-url.conf
# Points the agent at the hub by address: the container resolves through 1.1.1.1,
# which does not know beszel.lan, and AdGuard must not depend on itself to resolve.
[Service]
Environment="HUB_URL=http://192.168.1.201:8090"
